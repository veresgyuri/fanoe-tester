# settings.toml
# A FANOE tesztműszer beállítható paraméterei.
# Jelenleg csak OLVASVA vannak (code.py induláskor beolvassa őket, ha
# léteznek) - a "Beállítások" menüből történő MENTÉS még nincs
# implementálva, azt egy későbbi lépésben kötjük be (lásd
# .copilot-instructions.md 6. pont - boot.py user/dev mód a fájlíráshoz).
#
# Az itt szereplő alapértékek megegyeznek a fanoe_tester_logic.md-ben és
# a code.py-ban eddig hardcode-olt alapértékekkel.

# --- Mérési ciklus időzítése (FanoeMeasurementCycle) [ms] ---
T_ELO_MS = 1500  # beállítható: 0-3000 ms - step: 100 ms
T_BENT_MS = 3000  # beállítható: 500-7000 ms - step: 100 ms
T_UTO_MS = 1000  # beállítható: 500-5000 ms - step: 100 ms

# --- Ellenállás éldetektálási küszöb (r_be/r_ki-hez) [Ohm] ---
R_ELL_OHM = 70  # beállítható: 70-150 Ω  - step: 10 Ω

# --- TFT háttérvilágítás (PWM duty cycle, 0-65535) ---
BACKLIGHT_DUTY = 32768
# beállítható 9 lépésben: 96, 1024, 2048, 4096, 8192, 16384, 32768, 49152, 65535